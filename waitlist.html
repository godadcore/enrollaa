    <!-- Waitlist Main Form Section -->
    <main class="waitlist-main">
        <div class="container waitlist-grid">
            <!-- Left Side: Illustration -->
            <div class="waitlist-illustration">
                <img src="Second Illustration.png" alt="Group of 3 Nigerian students smiling">
            </div>

            <!-- Right Side: Form Container -->
            <div class="waitlist-form-container">
                <h2>Get Early Access</h2>
                <p class="subtext">Be the first to know when Enrollaa launches.</p>
                
                <form id="waitlist-form" novalidate>
                    <!-- Full Name -->
                    <div class="form-group">
                        <label for="full-name" class="form-label">Full Name</label>
                        <input type="text" id="full-name" class="form-input" placeholder="Enter your full name" required>
                    </div>

                    <!-- Email Address -->
                    <div class="form-group">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" id="email" class="form-input" placeholder="Enter your email address" required>
                    </div>

                    <!-- Phone Number -->
                    <div class="form-group">
                        <label for="phone" class="form-label">Phone Number <span style="font-weight: 400; opacity: 0.7;">(Optional)</span></label>
                        <input type="tel" id="phone" class="form-input" placeholder="e.g. +234 801 234 5678">
                    </div>

                    <!-- JAMB Candidate Toggle Switch -->
                    <div class="form-group">
                        <label class="form-label">Are you a JAMB candidate?</label>
                        <div class="toggle-wrapper">
                            <div class="toggle-container" id="jamb-toggle">
                                <span class="toggle-option active" data-val="yes">Yes</span>
                                <span class="toggle-option" data-val="no">No</span>
                            </div>
                            <input type="hidden" id="jamb-candidate-input" value="yes">
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-primary btn-submit">Join the Waitlist</button>
                    <!-- Validation message placeholder -->
                    <div id="form-message" class="form-message"></div>
                    <!-- Form Headcount and Avatars row for consistency -->
                    <div class="headcount-container text-center" style="margin-top: 24px; justify-content: center;">
                        <div class="avatar-group">
                            <img src="avatar/avatar1.jpg" alt="Avatar" class="avatar-img">
                            <img src="avatar/avatar2.jpg" alt="Avatar" class="avatar-img">
                            <img src="avatar/avatar3.jpg" alt="Avatar" class="avatar-img">
                            <img src="avatar/avatar4.jpg" alt="Avatar" class="avatar-img">
                            <img src="avatar/avatar5.jpg" alt="Avatar" class="avatar-img">
                        </div>
                        <span class="headcount-text">Loading waitlist...</span>
                    </div>
                </form>
            </div>
        </div>
    </main>
